name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · ubuntu-latest · node ${{ matrix.node }} · pi ${{ matrix.pi }}
    # The Gitea runner registers a single label: ubuntu-latest (docker://docker.gitea.com/runner-images:ubuntu-latest).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Use Node 24.
        node: ["24"]
        # 1.5.0 is the lowest supported Pi; latest catches breaking Pi releases.
        pi: ["1.5.0", latest]
    steps:
      - uses: actions/checkout@v7

      # actions/setup-node downloads from github.com/actions/node-versions, which is not reachable
      # from the runner network. nodejs.org/dist is reachable, so install the requested version there
      # and reuse the Node already present in the image when the major version matches.
      - name: Install Node ${{ matrix.node }}
        shell: bash
        run: |
          set -euo pipefail
          want="${{ matrix.node }}"
          have="$(node -p 'process.versions.node')"
          if [ "${have%%.*}" = "${want%%.*}" ]; then
            echo "Using the Node already in the image: v$have"
            exit 0
          fi
          url="https://registry.npmmirror.com/binary.html?path=node/v${want}/node-v${want}-linux-x64.tar.xz"
          echo "Downloading ${url}"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/node.tar.xz "${url}"
          rm -rf /opt/node
          mkdir -p /opt/node
          tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          rm -f /tmp/node.tar.xz
          echo "/opt/node/bin" >> "$GITHUB_PATH"

      # Pi's grep tool needs ripgrep. Pi downloads it from GitHub releases, which the runner
      # network cannot reach, so install it from the distribution packages instead.
      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail

          if command -v rg >/dev/null 2>&1; then
            echo "rg is already available: $(rg --version | head -1)"
            exit 0
          fi

          if [ "$(id -u)" = "0" ]; then
            SUDO=()
            apt=(apt-get)
          else
            SUDO=(sudo)
            apt=(sudo apt-get)
          fi

          # 将 Ubuntu APT 源替换为 USTC 镜像源
          backup_suffix=".bak.ustc.$(date +%Y%m%d%H%M%S)"

          if [ -f /etc/apt/sources.list ]; then
            "${SUDO[@]}" cp -a /etc/apt/sources.list "/etc/apt/sources.list${backup_suffix}"
            "${SUDO[@]}" sed -i -E \
              -e 's#https?://[^/ ]*archive\.ubuntu\.com/ubuntu#https://mirrors.ustc.edu.cn/ubuntu#g' \
              -e 's#https?://[^/ ]*security\.ubuntu\.com/ubuntu#https://mirrors.ustc.edu.cn/ubuntu#g' \
              -e 's#https?://[^/ ]*ports\.ubuntu\.com/ubuntu-ports#https://mirrors.ustc.edu.cn/ubuntu-ports#g' \
              /etc/apt/sources.list
          fi

          # 兼容 Ubuntu 24.04+ 的 deb822 格式：/etc/apt/sources.list.d/ubuntu.sources
          if [ -d /etc/apt/sources.list.d ]; then
            for f in /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              [ -e "$f" ] || continue
              "${SUDO[@]}" cp -a "$f" "${f}${backup_suffix}"
              "${SUDO[@]}" sed -i -E \
                -e 's#https?://[^/ ]*archive\.ubuntu\.com/ubuntu#https://mirrors.ustc.edu.cn/ubuntu#g' \
                -e 's#https?://[^/ ]*security\.ubuntu\.com/ubuntu#https://mirrors.ustc.edu.cn/ubuntu#g' \
                -e 's#https?://[^/ ]*ports\.ubuntu\.com/ubuntu-ports#https://mirrors.ustc.edu.cn/ubuntu-ports#g' \
                "$f"
            done
          fi

          "${apt[@]}" update -qq
          "${apt[@]}" install -y -qq ripgrep
          rg --version | head -1

      - run: npm ci --no-audit --no-fund

      - name: Install Pi ${{ matrix.pi }}
        shell: bash
        run: |
          set -euo pipefail

          # 使用国内 npm 镜像源（npmmirror，原淘宝源）加速，避免访问官方源超时
          NPM_MIRROR="https://registry.npmmirror.com"
          export npm_config_registry="$NPM_MIRROR"

          # 可选：镜像不可达时回退到官方源，避免因镜像故障导致 CI 失败
          if ! npm ping --registry="$NPM_MIRROR" >/dev/null 2>&1; then
            echo "::warning::npm mirror $NPM_MIRROR unreachable, falling back to registry.npmjs.org"
            export npm_config_registry="https://registry.npmjs.org"
          fi
          echo "Using npm registry: $(npm config get registry)"

          version=$(npm view "@earendil-works/pi-coding-agent@${{ matrix.pi }}" version)
          # Move every installed @earendil-works package to one version: Pi fails to load from a mixed tree.
          packages=$(ls node_modules/@earendil-works | sed "s|.*|@earendil-works/&@$version|")
          npm install --no-save --no-audit --no-fund $packages
          found=$( (npm ls --all 2>/dev/null || true) | grep -oE '@earendil-works/[a-z0-9-]+@[0-9][^ ]*' | sort -u)
          echo "$found"
          if echo "$found" | grep -v "@$version\$"; then
            echo "::error::Pi packages are not all at $version"
            exit 1
          fi

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Post-build cleanup
        if: always()
        run: |
          echo "清理已停止的容器..."
          docker container prune -f
          echo "清理未使用的镜像..."
          docker image prune -f

  package:
    name: package contents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Node 24
        shell: bash
        run: |
          set -euo pipefail
          have="$(node -p 'process.versions.node')"
          if [ "${have%%.*}" = "24" ]; then
            echo "Using the Node already in the image: v$have"
            exit 0
          fi
          url="https://registry.npmmirror.com/binary.html?path=node/v24.22.2/node-v24.22.2-linux-x64.tar.xz"
          echo "Downloading ${url}"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/node.tar.xz "${url}"
          rm -rf /opt/node
          mkdir -p /opt/node
          tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          rm -f /tmp/node.tar.xz
          echo "/opt/node/bin" >> "$GITHUB_PATH"

      - name: List the files npm would publish
        run: npm pack --dry-run --ignore-scripts

      - name: Post-build cleanup
        if: always()
        run: |
          echo "清理已停止的容器..."
          docker container prune -f
          echo "清理未使用的镜像..."
          docker image prune -f
